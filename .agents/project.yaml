# Project configuration consumed by AI agents (Claude, Cursor, Gemini, Codex, etc.)
# when they encounter {{VAR_NAME}} references in prompts and docs.
# Variable names are snake_case; the AI maps {{PROJECT_NAME}} -> project.project_name lexically.

project:
  project_name: 'Autonomous QA & AI-TestOps Engine'
  project_key: AQE
  webapp_domain: autonomous-qa.engine

backend:
  backend_repo: .
  backend_stack: 'TypeScript + Python (Pytest)'
  backend_entry: tests/

frontend:
  frontend_repo: .
  frontend_stack: 'Playwright + TypeScript'
  frontend_entry: tests/

database:
  db_type: PostgreSQL

issue_tracker:
  issue_tracker: github
  issue_tracker_cli: gh issue
  jira_url: null

testing:
  default_env: local
  tms_cli: bun xray

environments:
  local:
    web_url: 'http://localhost:3000'
    api_url: 'http://localhost:3000/api/v1'
    db_mcp: aqe-local-db
    api_mcp: aqe-local-api
  staging:
    web_url: 'https://staging.autonomous-qa.engine'
    api_url: 'https://staging.autonomous-qa.engine/api/v1'
    db_mcp: aqe-staging-db
    api_mcp: aqe-staging-api
