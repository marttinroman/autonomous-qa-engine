[pytest]
pythonpath = .
testpaths = tests/ai_eval
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --alluredir=allure-results -v --tb=short
markers =
    similarity: Tests for vector cosine similarity evaluation
    faithfulness: Tests for context faithfulness and hallucination fencing
    benchmark: Parameterized synthetic benchmark regression suite
    adversarial: Negative tests validating hallucination detection
